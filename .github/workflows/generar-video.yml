name: Generar video 2D

on:
  workflow_dispatch:
    inputs:
      tema:
        description: Nombre corto opcional (máximo 120 caracteres); escribe el guion en prompt
        required: false
        type: string
        default: Video de acertijos
      prompt:
        description: Escribe aquí guion/prompt completo (máximo 5000 caracteres); modo real genera clips con IA
        required: false
        type: string
        default: Crea un video vertical de 15 segundos con un presentador humano cartoon 2D sobre fondo azul, preguntas visuales, voz masculina en español y subtítulos blancos con contorno negro. Abre con una pregunta curiosa y revela su respuesta al final.
      formato:
        description: prompt-ia para prompt libre; acertijo-mapa requiere 60 segundos
        required: true
        type: choice
        default: prompt-ia
        options:
          - prompt-ia
          - historia
          - acertijo-mapa
      duracion:
        description: Duración del video en segundos
        required: true
        type: choice
        default: '15'
        options:
          - '10'
          - '15'
          - '30'
          - '45'
          - '60'
      demo:
        description: Vista previa con dibujos de código y voz robótica local; sin clips IA ni créditos
        required: true
        type: boolean
        default: true
      efectos:
        description: Añadir un efecto (puede consumir créditos fuera de demo)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generar:
    name: Renderizar y validar MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validar formulario
        env:
          VIDEO_THEME: ${{ inputs.tema }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_FORMAT: ${{ inputs.formato }}
          VIDEO_DURATION: ${{ inputs.duracion }}
          VIDEO_DEMO: ${{ inputs.demo }}
          VIDEO_SFX: ${{ inputs.efectos }}
        run: npm run validate-input

      - name: Instalar FFmpeg, ffprobe y voz local
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar código
        run: |
          npm test
          npm run typecheck

      - name: Usar Chrome del runner si está disponible
        run: |
          if command -v google-chrome > /dev/null 2>&1; then
            echo "REMOTION_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi

      - name: Generar video
        env:
          VIDEO_THEME: ${{ inputs.tema }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_FORMAT: ${{ inputs.formato }}
          VIDEO_DURATION: ${{ inputs.duracion }}
          VIDEO_DEMO: ${{ inputs.demo }}
          VIDEO_SFX: ${{ inputs.efectos }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TEXT_MODEL: ${{ vars.GOOGLE_TEXT_MODEL }}
          GOOGLE_VIDEO_MODEL: ${{ vars.GOOGLE_VIDEO_MODEL }}
        run: npm run generate

      - name: Comprobar entregables
        run: |
          test -s out/video.mp4
          test -s out/storyboard.json
          test -s out/subtitles.srt
          test -s out/validation.json

      - name: Publicar video descargable
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Recuperar escenas ya generadas si falla el montaje
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: escenas-parciales-${{ github.run_number }}
          path: |
            out/clips/
            out/plan.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Mostrar instrucciones de descarga
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Video listo

          Abre el resumen de esta ejecución y toca **Artifacts → video-[número]**.
          El ZIP contiene `video.mp4`, guion, subtítulos y validación.
          Cuando se generan escenas con IA, también incluye `clips/` y `plan.json`.
          En iPhone: descarga el ZIP, ábrelo en **Archivos** y descomprímelo.
          Abre `video.mp4` y usa **Compartir → Guardar video** para llevarlo a Fotos.

          El artifact se conserva durante 7 días. No se publica automáticamente en TikTok.
          SUMMARY
